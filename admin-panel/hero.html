<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AARVO • Live Hero Manager</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#09090d;color:#f7f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#24162f,#09090d 55%)}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#15151c;border:1px solid #30303b;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0007;margin-bottom:18px}.brand{font-size:28px;font-weight:900;letter-spacing:.1em}.muted{color:#aaaab5}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}input,textarea,button{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #3b3b48;background:#0e0e13;color:#fff;margin-top:10px}button{background:#fff;color:#111;font-weight:800;cursor:pointer}button.secondary{background:#262631;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero{position:relative;height:250px;border-radius:18px;overflow:hidden;background:#222;margin-top:15px}.hero img{width:100%;height:100%;object-fit:cover}.hero .shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000c)}.hero .copy{position:absolute;left:20px;bottom:18px}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#eee}.item{border:1px solid #30303b;border-radius:16px;padding:14px;margin-top:12px}.itemgrid{display:grid;grid-template-columns:180px 1fr auto;gap:15px;align-items:center}.thumb{width:180px;height:100px;border-radius:12px;object-fit:cover;background:#222}.actions{display:flex;gap:8px}.actions button{width:auto;margin:0}.good{color:#70e0a0}.err{color:#ff8d9a}@media(max-width:700px){.row,.itemgrid{grid-template-columns:1fr}.thumb{width:100%;height:170px}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="brand">AARVO</div><div class="muted">Live Hero Manager • Admin only</div></div><button id="logout" class="secondary" style="width:auto">Sign out</button></div>
<section id="login" class="card"><h2>Admin Sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">Sign in</button><div id="loginMsg"></div></section>
<section id="panel" class="hidden">
<div class="card"><div class="top"><div><h2 style="margin:0">Add Live Hero</h2><div class="muted">Save a banner here and it becomes available to the AARVO Home screen through the live API.</div></div><button id="refresh" class="secondary" style="width:auto">Refresh</button></div>
<input id="imageUrl" placeholder="Hero image URL (https://...)" oninput="preview()">
<div class="row"><input id="title" placeholder="Title"><input id="subtitle" placeholder="Subtitle"></div>
<div class="row"><input id="ctaLabel" placeholder="Button label, e.g. Shop now"><input id="ctaTarget" placeholder="Target/category, optional"></div>
<div class="row"><input id="sortOrder" type="number" value="0" placeholder="Order"><select id="active"><option value="true">Active — show in app</option><option value="false">Inactive — hide</option></select></div>
<div id="preview" class="hero" style="display:none"><img id="previewImg"><div class="shade"></div><div class="copy"><h2 id="previewTitle">AARVO Premium Picks</h2><p id="previewSubtitle"></p></div></div>
<button id="save">Publish Hero Live</button><div id="msg"></div></div>
<div class="card"><h2>Current Hero Slides</h2><div id="list" class="muted">Loading…</div></div>
</section></main>
<script>
const API='https://aarvo-api.onrender.com';const $=id=>document.getElementById(id);const token=()=>sessionStorage.getItem('aarvo_admin_token')||'';
function show(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden');load() }function logout(){sessionStorage.removeItem('aarvo_admin_token');location.reload()}
async function req(path,opt={}){const h={'Accept':'application/json','Content-Type':'application/json','Authorization':'Bearer '+token(),...(opt.headers||{})};const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d}
$('logout').onclick=logout;$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='Signing in…';try{const r=await fetch(API+'/v1/auth/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');if((d.user?.role||'').toUpperCase()!=='ADMIN')throw Error('Admin authorization failed');sessionStorage.setItem('aarvo_admin_token',d.token);show()}catch(e){$('loginMsg').className='err';$('loginMsg').textContent=e.message}};
function preview(){const u=$('imageUrl').value.trim();$('preview').style.display=u?'block':'none';$('previewImg').src=u;$('previewTitle').textContent=$('title').value||'AARVO Premium Picks';$('previewSubtitle').textContent=$('subtitle').value||''}
['title','subtitle'].forEach(x=>$(x).addEventListener('input',preview));
$('save').onclick=async()=>{const imageUrl=$('imageUrl').value.trim();if(!/^https?:\\/\\//i.test(imageUrl))return alert('Valid HTTPS image URL required.');$('msg').textContent='Publishing…';try{await req('/v1/admin/home/hero',{method:'POST',body:JSON.stringify({imageUrl,title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),ctaLabel:$('ctaLabel').value.trim(),ctaTarget:$('ctaTarget').value.trim(),sortOrder:Number($('sortOrder').value)||0,isActive:$('active').value==='true'})});$('msg').className='good';$('msg').textContent='Hero published. It is now live from the API.';load()}catch(e){$('msg').className='err';$('msg').textContent=e.message}};
async function load(){const list=$('list');list.textContent='Loading…';try{const d=await req('/v1/admin/home/hero');if(!Array.isArray(d)||!d.length){list.textContent='No hero slides.';return}list.innerHTML=d.map(s=>`<div class="item"><div class="itemgrid"><img class="thumb" src="${esc(s.image_url)}"><div><b>${esc(s.title||'Untitled')}</b><div class="muted">${esc(s.subtitle||'')}</div><div>${s.is_active?'<span class="good">● ACTIVE</span>':'INACTIVE'} • order ${s.sort_order}</div></div><div class="actions"><button class="secondary" onclick="toggleHero(${s.id},${!s.is_active})">${s.is_active?'Hide':'Activate'}</button><button onclick="deleteHero(${s.id})">Delete</button></div></div></div>`).join('')}catch(e){list.className='err';list.textContent='Could not load heroes: '+e.message}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function toggleHero(id,on){try{const d=await req('/v1/admin/home/hero');const s=d.find(x=>Number(x.id)===Number(id));if(!s)return;await req('/v1/admin/home/hero/'+id,{method:'PUT',body:JSON.stringify({imageUrl:s.image_url,title:s.title,subtitle:s.subtitle,ctaLabel:s.cta_label,ctaTarget:s.cta_target,sortOrder:s.sort_order,isActive:on})});load()}catch(e){alert(e.message)}}
async function deleteHero(id){if(!confirm('Delete this hero slide?'))return;try{await req('/v1/admin/home/hero/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
$('refresh').onclick=load;if(token())show();
</script></body></html>
