name: AARVO Build Trigger

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: aarvo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Source is now authoritative in the repository; do not mutate Kotlin/JS during CI.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PaarvoApiBaseUrl=https://aarvo-api.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-debug-latest
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
