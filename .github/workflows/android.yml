name: AARVO CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: aarvo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AARVO_API_BASE_URL: https://aarvo-api.onrender.com

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Check backend syntax
        run: npm run check
      - name: Run backend contract tests
        run: npm test
      - name: Validate production files
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f .env.example
          test -f .env.production.example
          test -f docker-compose.production.yml
          test -f src/migrate.js
          test -f schema.sql
          test -f migrations/001_production_integrity.sql
          test -f migrations/002_marketplace_operations.sql
          test -f migrations/003_reviews_delivery.sql
          test -f migrations/004_marketplace_hardening.sql
          test -f migrations/005_operational_indexes.sql
          test ! -f migrations/003_marketplace_reviews_and_returns.sql
          grep -q "CREATE UNIQUE INDEX" migrations/001_production_integrity.sql
          grep -q "idempotency_key" migrations/002_marketplace_operations.sql
          grep -q "audit_events" migrations/002_marketplace_operations.sql
          grep -q "product_reviews" migrations/003_reviews_delivery.sql
          grep -q "delivery_events" migrations/003_reviews_delivery.sql
          grep -q "order_disputes" migrations/003_reviews_delivery.sql
          grep -q "orders_payment_status_chk" migrations/004_marketplace_hardening.sql
          grep -q "orders_money_nonnegative_chk" migrations/004_marketplace_hardening.sql
          grep -q "orders_created_at_idx" migrations/005_operational_indexes.sql
          grep -q "node src/migrate.js" docker-compose.production.yml
      - name: Build backend container
        run: docker build --pull -t aarvo-api:ci .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL}" -Pmsg91WidgetToken="${MSG91_WIDGET_TOKEN}"
        env:
          MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}
      - name: Prepare release signing
        shell: bash
        env:
          AARVO_KEYSTORE_BASE64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
          AARVO_KEYSTORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          AARVO_KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          AARVO_KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AARVO_KEYSTORE_BASE64" || { echo "Missing AARVO_KEYSTORE_BASE64"; exit 1; }
          test -n "$AARVO_KEYSTORE_PASSWORD" || { echo "Missing AARVO_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$AARVO_KEY_ALIAS" || { echo "Missing AARVO_KEY_ALIAS"; exit 1; }
          test -n "$AARVO_KEY_PASSWORD" || { echo "Missing AARVO_KEY_PASSWORD"; exit 1; }
          printf '%s' "$AARVO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aarvo-release-key.jks"
          test -s "$RUNNER_TEMP/aarvo-release-key.jks"
      - name: Build release AAB (signed)
        run: gradle :app:bundleRelease --stacktrace --project-prop aarvoReleaseStoreFile="$RUNNER_TEMP/aarvo-release-key.jks" --project-prop aarvoReleaseStorePassword="$AARVO_KEYSTORE_PASSWORD" --project-prop aarvoReleaseKeyAlias="$AARVO_KEY_ALIAS" --project-prop aarvoReleaseKeyPassword="$AARVO_KEY_PASSWORD" -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL}" -Pmsg91WidgetToken="${MSG91_WIDGET_TOKEN}"
        env:
          MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}
          AARVO_KEYSTORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          AARVO_KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          AARVO_KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab > "$RUNNER_TEMP/aab-signature-check.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-check.txt"
      - name: Clean release signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aarvo-release-key.jks"
      - name: Attest debug APK provenance
        uses: actions/attest@v4
        with:
          subject-path: 'app/build/outputs/apk/debug/*.apk'
      - name: Attest release AAB provenance
        uses: actions/attest@v4
        with:
          subject-path: 'app/build/outputs/bundle/release/*.aab'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-aab
          path: app/build/outputs/bundle/release/*.aab
