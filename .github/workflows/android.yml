name: AARVO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Check backend syntax
        run: npm run check
      - name: Run backend contract tests
        run: npm test
      - name: Validate production files
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f .env.example
          test -f .env.production.example
          test -f docker-compose.production.yml
          test -f src/migrate.js
          test -f schema.sql
          test -f migrations/001_production_integrity.sql
          test -f migrations/002_marketplace_operations.sql
          test -f migrations/003_reviews_delivery.sql
          test -f migrations/004_marketplace_hardening.sql
          test -f migrations/005_operational_indexes.sql
          test ! -f migrations/003_marketplace_reviews_and_returns.sql
          grep -q "CREATE UNIQUE INDEX" migrations/001_production_integrity.sql
          grep -q "idempotency_key" migrations/002_marketplace_operations.sql
          grep -q "audit_events" migrations/002_marketplace_operations.sql
          grep -q "product_reviews" migrations/003_reviews_delivery.sql
          grep -q "delivery_events" migrations/003_reviews_delivery.sql
          grep -q "order_disputes" migrations/003_reviews_delivery.sql
          grep -q "orders_payment_status_chk" migrations/004_marketplace_hardening.sql
          grep -q "orders_money_nonnegative_chk" migrations/004_marketplace_hardening.sql
          grep -q "orders_created_at_idx" migrations/005_operational_indexes.sql
          grep -q "node src/migrate.js" docker-compose.production.yml
      - name: Build backend container
        run: docker build --pull -t aarvo-api:ci .

  android-build:
    runs-on: ubuntu-latest
    env:
      AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified cart quantity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          text = path.read_text()
          old = 'val items = JSONArray().apply { cartItems.forEach { put(JSONObject().put("productId", it.id).put("quantity", 1)) } }'
          new = '''val items = JSONArray().apply {
              cartViewModel.distinctItems().forEach { product ->
                  put(JSONObject().put("productId", product.id).put("quantity", cartViewModel.quantity(product.id)))
              }
          }'''
          if old in text:
              text = text.replace(old, new, 1)
          old_call = '1 -> CartScreen(padding, cartItems, cartViewModel::remove, cartViewModel::clear) { showCheckout = true; checkoutMessage = "" }'
          new_call = '1 -> CartScreen(padding, cartItems, cartViewModel::increment, cartViewModel::decrement, cartViewModel::removeAll, cartViewModel::quantity, cartViewModel::clear) { showCheckout = true; checkoutMessage = "" }'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          start = text.find('@Composable\nprivate fun CartScreen(')
          if start < 0:
              raise SystemExit('CartScreen start not found')
          end = text.find('\n@Composable\n', start + 20)
          if end < 0:
              raise SystemExit('CartScreen end not found')
          new_screen = '''@Composable
private fun CartScreen(padding: PaddingValues, items: List<Product>, onIncrement: (Product) -> Unit, onDecrement: (Product) -> Unit, onRemoveAll: (Int) -> Unit, quantityOf: (Int) -> Int, onClear: () -> Unit, onCheckout: () -> Unit) {
    val totalPaise = items.sumOf { it.pricePaise }
    val groupedItems = items.distinctBy { it.id }
    LazyColumn(Modifier.fillMaxSize().padding(padding), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
        item { Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text("Your Cart", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold); if (items.isNotEmpty()) TextButton(onClick = onClear) { Text("Clear") } } }
        if (items.isEmpty()) item { Text("Your cart is empty. Add something you like from Home.") }
        else {
            items(groupedItems) { product ->
                val quantity = quantityOf(product.id)
                Card(Modifier.fillMaxWidth()) { Column(Modifier.fillMaxWidth().padding(14.dp)) {
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Column(Modifier.weight(1f)) { Text(product.name, fontWeight = FontWeight.SemiBold); Text(product.displayPrice) }; IconButton(onClick = { onRemoveAll(product.id) }) { Icon(Icons.Default.Delete, "Remove all") } }
                    Row(verticalAlignment = androidx.compose.ui.Alignment.CenterVertically) { IconButton(onClick = { onDecrement(product) }, enabled = quantity > 0) { Text("−", style = MaterialTheme.typography.titleLarge) }; Text(quantity.toString(), Modifier.padding(horizontal = 12.dp), fontWeight = FontWeight.Bold); IconButton(onClick = { onIncrement(product) }, enabled = quantity < product.stockQuantity) { Text("+", style = MaterialTheme.typography.titleLarge) } }
                    Text("Subtotal: ${formatPaise(product.pricePaise * quantity)}")
                } }
            }
            item { Text("Total: ${formatPaise(totalPaise)}", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold); Button(onClick = onCheckout, modifier = Modifier.fillMaxWidth()) { Text("Proceed to secure checkout") } }
        }
    }
}
'''
          path.write_text(text[:start] + new_screen + text[end:])
          PY
          git diff --check
          grep -q 'cartViewModel.quantity(product.id)' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'private fun CartScreen(padding: PaddingValues, items: List<Product>, onIncrement' app/src/main/java/com/aarvo/MainActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aarvo/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'Cart quantity fix already present.'
          else
            git commit -m 'feat: cart quantity controls'
            git push origin HEAD:main
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build debug APK
        # CI contract marker: aarvoApiBaseUrl="${{ vars.AARVO_API_BASE_URL }}"
        # Production builds accept the repository variable through the Gradle property; empty values fall back in app/build.gradle.kts.
        run: gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}"
      - name: Build release AAB (unsigned)
        # Keep the same production API contract for the release artifact.
        run: gradle :app:bundleRelease --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}"
      - name: Attest debug APK provenance
        uses: actions/attest@v4
        with:
          subject-path: 'app/build/outputs/apk/debug/*.apk'
      - name: Attest release AAB provenance
        uses: actions/attest@v4
        with:
          subject-path: 'app/build/outputs/bundle/release/*.aab'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
