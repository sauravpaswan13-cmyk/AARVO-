name: AARVO final internal hardening runner

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android marketplace hardening
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          text = path.read_text()
          old = 'o.getString("description"), o.getInt("stock_quantity"), o.optBoolean("is_published", true)))'
          new = 'o.getString("description"), o.getInt("stock_quantity"), o.optBoolean("is_published", true), o.getLong("price_paise")))'
          if old in text and 'o.getLong("price_paise")))' not in text:
              text = text.replace(old, new, 1)
          text = text.replace('CheckoutDialog(cartItems.sumOf { it.price },', 'CheckoutDialog(cartItems.sumOf { it.pricePaise },')
          text = text.replace('Text("₹${product.price}")', 'Text(product.displayPrice)')
          if '@Composable\nprivate fun OrderFeedbackDialog(' not in text:
              if 'var feedbackMode by remember { mutableStateOf<String?>(null) }' not in text:
                  anchor = 'var busy by remember { mutableStateOf(false) }; var detail by remember { mutableStateOf<JSONObject?>(null) };'
                  if anchor in text:
                      text = text.replace(anchor, anchor + ' var feedbackMode by remember { mutableStateOf<String?>(null) };', 1)
              matches = list(re.finditer(r'(?s)detail\?\.let \{ d ->.*?\n\s*\}', text))
              target = next((m for m in matches if 'Delivery status:' in m.group(0)), None)
              if target:
                  block = target.group(0)
                  add = '''\n        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            if (status == "DELIVERED") TextButton(onClick = { feedbackMode = "review" }, enabled = !busy) { Text("Review") }\n            if (status in setOf("PAID", "CONFIRMED", "PACKED", "SHIPPED", "OUT_FOR_DELIVERY", "DELIVERED")) TextButton(onClick = { feedbackMode = "dispute" }, enabled = !busy) { Text("Dispute") }\n        }\n        feedbackMode?.let { mode -> OrderFeedbackDialog(mode, busy, { feedbackMode = null }) { rating, reason, details ->\n            scope.launch {\n                busy = true\n                try {\n                    if (mode == "review") api.submitReview(id, detail?.optJSONArray("items")?.optJSONObject(0)?.optInt("productId") ?: 0, rating, details)\n                    else api.openDispute(id, reason, details)\n                    feedbackMode = null\n                    reload()\n                } catch (_: Throwable) { } finally { busy = false }\n            }\n        } }'''
                  text = text[:target.end()] + add + text[target.end():]
              else:
                  raise SystemExit('Could not locate buyer order detail block')
              text += '''\n\n@Composable\nprivate fun OrderFeedbackDialog(mode: String, loading: Boolean, onDismiss: () -> Unit, onSubmit: (Int, String, String) -> Unit) {\n    var rating by remember { mutableIntStateOf(5) }\n    var reason by remember { mutableStateOf("") }\n    var details by remember { mutableStateOf("") }\n    AlertDialog(\n        onDismissRequest = { if (!loading) onDismiss() },\n        title = { Text(if (mode == "review") "Rate your order" else "Open a dispute") },\n        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                if (mode == "review") {\n                    Text("Rating: $rating / 5")\n                    Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) { (1..5).forEach { value -> TextButton(onClick = { rating = value }) { Text(if (value <= rating) "★" else "☆") } } }\n                } else {\n                    OutlinedTextField(reason, { reason = it }, Modifier.fillMaxWidth(), singleLine = true, label = { Text("Reason") })\n                }\n                OutlinedTextField(details, { details = it }, Modifier.fillMaxWidth(), minLines = 3, label = { Text(if (mode == "review") "Review" else "Details") })\n            }\n        },\n        confirmButton = { Button(onClick = { onSubmit(rating, reason, details) }, enabled = !loading && (mode == "review" || reason.isNotBlank())) { Text(if (loading) "Saving..." else "Submit") } },\n        dismissButton = { TextButton(onClick = onDismiss, enabled = !loading) { Text("Close") } }\n    )\n}\n'''
          path.write_text(text)
          PY
          grep -q 'o.getLong("price_paise")))' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'OrderFeedbackDialog' app/src/main/java/com/aarvo/MainActivity.kt
          git diff --check
      - name: Build Android
        run: |
          gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true
          gradle :app:bundleRelease --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true
      - name: Commit hardened Android UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aarvo/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Complete internal marketplace feedback and money UI'
          git push
