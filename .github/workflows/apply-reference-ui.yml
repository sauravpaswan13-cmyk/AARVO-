name: Apply AARVO Reference UI

on:
  push:
    paths:
      - tools/apply-reference-ui.trigger

permissions:
  contents: write

jobs:
  ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium reference UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          s = p.read_text()

          old = '        !onboarded -> OnboardingScreen { prefs.edit().putBoolean("onboarded", true).apply(); onboarded = true }'
          new = '''        !onboarded -> OnboardingScreen(
            onGuest = { prefs.edit().putBoolean("onboarded", true).putBoolean("guest_mode", true).putBoolean("signed_in", false).apply(); onboarded = true; guestMode = true },
            onLogin = { openOtpLogin() }
        )'''
          if old not in s:
              raise SystemExit('AarvoRoot onboarding hook not found')
          s = s.replace(old, new, 1)

          onboarding = '''@Composable
          private fun OnboardingScreen(onGuest: () -> Unit, onLogin: () -> Unit) {
              androidx.compose.foundation.layout.Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = androidx.compose.ui.Alignment.CenterHorizontally
              ) {
                  Text("AARVO", style = MaterialTheme.typography.displaySmall, fontWeight = FontWeight.ExtraBold, color = MaterialTheme.colorScheme.primary)
                  Spacer(Modifier.height(6.dp))
                  Text("Your One Stop Shopping Destination", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                  Spacer(Modifier.height(22.dp))
                  Text("🛍️ 🛍️ 🛍️", style = MaterialTheme.typography.displayLarge)
                  Spacer(Modifier.height(22.dp))
                  Button(onClick = onGuest, modifier = Modifier.fillMaxWidth()) { Text("Continue as Guest") }
                  Spacer(Modifier.height(10.dp))
                  androidx.compose.material3.OutlinedButton(onClick = onLogin, modifier = Modifier.fillMaxWidth()) { Text("Login / Sign Up") }
                  Spacer(Modifier.height(6.dp))
                  TextButton(onClick = onGuest) { Text("Explore as Guest") }
                  Spacer(Modifier.height(18.dp))
                  Text("✓ 100% Genuine     •     ⚡ Fast Delivery     •     🔒 Secure Payments", style = MaterialTheme.typography.bodySmall)
              }
          }
          
          '''
          s, n = re.subn(r'@Composable private fun OnboardingScreen\(.*?\n\n@Composable private fun SignInScreen', onboarding + '@Composable private fun SignInScreen', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('OnboardingScreen replacement failed')

          home = '''@Composable
          private fun HomeScreen(padding: PaddingValues, query: String, onQueryChange: (String) -> Unit, categories: List<String>, selectedCategory: String, onCategoryChange: (String) -> Unit, products: List<Product>, loading: Boolean, error: String, onAdd: (Product) -> Unit, onOpen: (Product) -> Unit, wishlist: Set<Int>, onToggleWishlist: (Int) -> Unit, onFilter: () -> Unit, sortMode: String, minRating: Double, maxPrice: Long?, inStockOnly: Boolean) {
              LazyColumn(Modifier.fillMaxSize().padding(padding), contentPadding = PaddingValues(14.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Text("AARVO", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.ExtraBold, color = MaterialTheme.colorScheme.primary)
                      Text("Shop smart • Live better", style = MaterialTheme.typography.bodyMedium)
                  }
                  item {
                      OutlinedTextField(query, onQueryChange, Modifier.fillMaxWidth(), singleLine = true, label = { Text("Search for products, brands and more...") })
                  }
                  item {
                      Card(Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(18.dp)) {
                              Text("Big Savings", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.ExtraBold, color = MaterialTheme.colorScheme.primary)
                              Text("Bigger Smiles", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.ExtraBold)
                              Text("Up to 70% OFF", style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(8.dp))
                              Button(onClick = { if (categories.size > 1) onCategoryChange(categories.getOrNull(1) ?: "All") }) { Text("Shop Now") }
                          }
                      }
                  }
                  item {
                      Text("Categories", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(categories) { item ->
                              androidx.compose.material3.AssistChip(onClick = { onCategoryChange(item) }, label = { Text(if (item == selectedCategory) "✓ $item" else item) })
                          }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("Top Deals", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                          TextButton(onClick = onFilter) { Text("View All") }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          TextButton(onClick = onFilter) { Text("Filters & Sort") }
                          if (sortMode != "Relevance") Text("• $sortMode", style = MaterialTheme.typography.bodySmall)
                          if (minRating > 0) Text("• ${minRating}★+", style = MaterialTheme.typography.bodySmall)
                      }
                  }
                  if (loading) item { CircularProgressIndicator() }
                  if (error.isNotBlank()) item { Text(error, color = MaterialTheme.colorScheme.error) }
                  if (!loading && error.isBlank() && products.isEmpty()) item { Text("No products match your current search or filters.") }
                  items(products, key = { it.id }) { product -> ProductCard(product, product.id in wishlist, onAdd, onOpen, onToggleWishlist) }
              }
          }
          
          '''
          s, n = re.subn(r'@Composable private fun HomeScreen\(.*?\n\n@Composable private fun ProductCard', home + '@Composable private fun ProductCard', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('HomeScreen replacement failed')

          card = '''@Composable
          private fun ProductCard(product: Product, isSaved: Boolean, onAdd: (Product) -> Unit, onOpen: (Product) -> Unit, onToggleWishlist: (Int) -> Unit) {
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("${product.emoji}  ${product.name}", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                          IconButton(onClick = { onToggleWishlist(product.id) }) { Icon(if (isSaved) Icons.Default.Favorite else Icons.Default.FavoriteBorder, "Wishlist") }
                      }
                      Text(product.category, style = MaterialTheme.typography.bodySmall)
                      Text(product.displayPrice, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.ExtraBold)
                      Text("★ ${product.rating}  •  ${if (product.stockQuantity > 0) "In Stock" else "Out of Stock"}", style = MaterialTheme.typography.bodySmall)
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          TextButton(onClick = { onOpen(product) }) { Text("View details") }
                          Button(onClick = { onAdd(product) }, enabled = product.stockQuantity > 0, modifier = Modifier.weight(1f)) { Text("Add to Cart") }
                      }
                  }
              }
          }
          
          '''
          s, n = re.subn(r'@Composable private fun ProductCard\(.*?\n\n@Composable private fun ProductDetailsScreen', card + '@Composable private fun ProductDetailsScreen', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ProductCard replacement failed')

          p.write_text(s)
          PY
      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aarvo/MainActivity.kt
          git commit -m 'Apply AARVO premium reference shopping UI'
          git push
