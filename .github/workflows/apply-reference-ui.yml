name: Apply AARVO Reference UI

on:
  push:
    paths:
      - tools/apply-reference-ui.trigger

permissions:
  contents: write

jobs:
  ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium reference UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          s = p.read_text()

          imports = '''import androidx.compose.foundation.Canvas
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.Box
import androidx.compose.foundation.layout.size
import androidx.compose.ui.Alignment
import androidx.compose.ui.graphics.Brush
import androidx.compose.ui.graphics.Color
import androidx.compose.foundation.shape.RoundedCornerShape
'''
          anchor = 'import androidx.compose.foundation.layout.Arrangement\n'
          if 'import androidx.compose.foundation.Canvas' not in s:
              s = s.replace(anchor, anchor + imports, 1)

          old = '        !onboarded -> OnboardingScreen { prefs.edit().putBoolean("onboarded", true).apply(); onboarded = true }'
          new = '''        !onboarded -> OnboardingScreen(
            onGuest = { prefs.edit().putBoolean("onboarded", true).putBoolean("guest_mode", true).putBoolean("signed_in", false).apply(); onboarded = true; guestMode = true },
            onLogin = { openOtpLogin() }
        )'''
          if old in s:
              s = s.replace(old, new, 1)

          onboarding = '''@Composable
          private fun OnboardingScreen(onGuest: () -> Unit, onLogin: () -> Unit) {
              Column(Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center, horizontalAlignment = Alignment.CenterHorizontally) {
                  AarvoLogoMark(86.dp)
                  Spacer(Modifier.height(8.dp))
                  Text("AARVO", style = MaterialTheme.typography.displaySmall, fontWeight = FontWeight.ExtraBold, color = Color(0xFF2F258C))
                  Spacer(Modifier.height(5.dp))
                  Text("Your One Stop Shopping Destination", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                  Spacer(Modifier.height(20.dp))
                  Text("🛍️   🛍️   🛍️", style = MaterialTheme.typography.displayLarge)
                  Spacer(Modifier.height(20.dp))
                  Button(onClick = onGuest, modifier = Modifier.fillMaxWidth()) { Text("Continue as Guest") }
                  Spacer(Modifier.height(10.dp))
                  androidx.compose.material3.OutlinedButton(onClick = onLogin, modifier = Modifier.fillMaxWidth()) { Text("Login / Sign Up") }
                  Spacer(Modifier.height(6.dp))
                  TextButton(onClick = onGuest) { Text("Explore as Guest") }
                  Spacer(Modifier.height(18.dp))
                  Text("Secure Shopping  •  Trusted Support  •  Fast Delivery", style = MaterialTheme.typography.bodySmall)
              }
          }

          @Composable
          private fun AarvoLogoMark(size: androidx.compose.ui.unit.Dp) {
              Canvas(Modifier.size(size)) {
                  val w = this.size.width
                  val h = this.size.height
                  val brush = Brush.linearGradient(listOf(Color(0xFFFFB000), Color(0xFFFF6B22), Color(0xFFE92B78), Color(0xFF4B2CC5)))
                  drawLine(brush, androidx.compose.ui.geometry.Offset(w*0.18f,h*0.84f), androidx.compose.ui.geometry.Offset(w*0.50f,h*0.12f), strokeWidth=w*0.19f, cap=androidx.compose.ui.graphics.StrokeCap.Round)
                  drawLine(brush, androidx.compose.ui.geometry.Offset(w*0.50f,h*0.12f), androidx.compose.ui.geometry.Offset(w*0.84f,h*0.84f), strokeWidth=w*0.19f, cap=androidx.compose.ui.graphics.StrokeCap.Round)
                  drawLine(brush, androidx.compose.ui.geometry.Offset(w*0.30f,h*0.56f), androidx.compose.ui.geometry.Offset(w*0.70f,h*0.56f), strokeWidth=w*0.12f, cap=androidx.compose.ui.graphics.StrokeCap.Round)
              }
          }

          '''
          s, n = re.subn(r'@Composable private fun OnboardingScreen\(.*?\n\n@Composable private fun SignInScreen', onboarding + '@Composable private fun SignInScreen', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('OnboardingScreen replacement failed')

          home = '''@Composable
          private fun HomeScreen(padding: PaddingValues, query: String, onQueryChange: (String) -> Unit, categories: List<String>, selectedCategory: String, onCategoryChange: (String) -> Unit, products: List<Product>, loading: Boolean, error: String, onAdd: (Product) -> Unit, onOpen: (Product) -> Unit, wishlist: Set<Int>, onToggleWishlist: (Int) -> Unit, onFilter: () -> Unit, sortMode: String, minRating: Double, maxPrice: Long?, inStockOnly: Boolean) {
              LazyColumn(Modifier.fillMaxSize().padding(padding), contentPadding = PaddingValues(14.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      OutlinedTextField(query, onQueryChange, Modifier.fillMaxWidth(), singleLine=true, label={ Text("Search for products, brands and more...") }, leadingIcon={ Text("⌕", style=MaterialTheme.typography.titleLarge) })
                  }
                  item {
                      Box(Modifier.fillMaxWidth().background(Brush.linearGradient(listOf(Color(0xFF3E16B5), Color(0xFF7B1FE8), Color(0xFFF02D88), Color(0xFFFF9D1E))), RoundedCornerShape(24.dp)).padding(18.dp)) {
                          Column {
                              Text("Big Savings", color=Color.White, style=MaterialTheme.typography.headlineSmall, fontWeight=FontWeight.ExtraBold)
                              Text("Bigger Smiles", color=Color.White, style=MaterialTheme.typography.headlineSmall, fontWeight=FontWeight.ExtraBold)
                              Text("Up to 70% OFF", color=Color.White, style=MaterialTheme.typography.bodyLarge, fontWeight=FontWeight.Bold)
                              Spacer(Modifier.height(8.dp))
                              Button(onClick={ if(categories.size>1) onCategoryChange(categories.getOrNull(1) ?: "All") }) { Text("Shop Now") }
                          }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically) {
                          Text("Categories", style=MaterialTheme.typography.titleLarge, fontWeight=FontWeight.Bold)
                          TextButton(onClick=onFilter){ Text("View All") }
                      }
                      LazyRow(horizontalArrangement=Arrangement.spacedBy(9.dp)) {
                          items(categories) { item ->
                              androidx.compose.material3.AssistChip(onClick={onCategoryChange(item)}, label={Text(if(item==selectedCategory) "✓ $item" else item)})
                          }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically) {
                          Text("Top Deals", style=MaterialTheme.typography.titleLarge, fontWeight=FontWeight.Bold)
                          TextButton(onClick=onFilter){ Text("View All") }
                      }
                  }
                  item {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.spacedBy(8.dp)) {
                          TextButton(onClick=onFilter){ Text("Filters & Sort") }
                          if(sortMode!="Relevance") Text("• $sortMode", style=MaterialTheme.typography.bodySmall)
                      }
                  }
                  if(loading) item { CircularProgressIndicator() }
                  if(error.isNotBlank()) item { Text(error, color=MaterialTheme.colorScheme.error) }
                  if(!loading && error.isBlank() && products.isEmpty()) item { Text("No products match your current search or filters.") }
                  items(products,key={it.id}) { product -> ProductCard(product, product.id in wishlist, onAdd, onOpen, onToggleWishlist) }
              }
          }

          '''
          s, n = re.subn(r'@Composable private fun HomeScreen\(.*?\n\n@Composable private fun ProductCard', home + '@Composable private fun ProductCard', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('HomeScreen replacement failed')

          topbar_old = 'TopAppBar(title = { Text(if (role == "SELLER") "AARVO Seller" else "AARVO", fontWeight = FontWeight.Bold) }, actions = {'
          topbar_new = 'TopAppBar(title = { Row(verticalAlignment = Alignment.CenterVertically) { AarvoLogoMark(34.dp); Spacer(Modifier.size(6.dp)); Text(if (role == "SELLER") "AARVO Seller" else "AARVO", color=Color(0xFF30258C), fontWeight = FontWeight.ExtraBold) } }, actions = {'
          if topbar_old in s:
              s=s.replace(topbar_old,topbar_new,1)

          p.write_text(s)
          PY
      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aarvo/MainActivity.kt
          git commit -m 'Match AARVO reference logo colors and home screen'
          git push
