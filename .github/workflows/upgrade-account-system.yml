name: Upgrade AARVO Account System

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/aarvo/MainActivity.kt'
      - '.github/workflows/upgrade-account-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-account-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify account center source
        run: |
          grep -q '@Composable private fun AccountScreen' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'My Orders' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'Address Book' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'Payment Methods' app/src/main/java/com/aarvo/MainActivity.kt
          grep -q 'Settings' app/src/main/java/com/aarvo/MainActivity.kt
          echo "Account source is authoritative and valid."
