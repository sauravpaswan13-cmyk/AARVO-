name: Upgrade AARVO Account System

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/aarvo/MainActivity.kt'
      - 'app/src/main/java/com/aarvo/PhoneAuthActivity.kt'
      - '.github/workflows/upgrade-account-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-account-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile Android Kotlin sources
        run: ./gradlew :app:compileDebugKotlin
