name: Upgrade AARVO Account System

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/aarvo/MainActivity.kt'
      - '.github/workflows/upgrade-account-system.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade customer account center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          text = path.read_text()
          start = text.find('@Composable private fun AccountScreen(')
          end = text.find('@Composable private fun OrdersScreen(', start)
          if start < 0 or end < 0:
              raise SystemExit('AccountScreen boundaries not found')
          new_block = r'''@Composable private fun AccountScreen(padding: PaddingValues, userName: String, role: String, api: AarvoApiClient, activity: MainActivity, guestMode: Boolean, onLogin: () -> Unit, onSignOut: () -> Unit) {
    var section by remember { mutableStateOf("account") }
    var info by remember { mutableStateOf<String?>(null) }
    if (info != null) AlertDialog(onDismissRequest = { info = null }, title = { Text("AARVO") }, text = { Text(info!!) }, confirmButton = { Button(onClick = { info = null }) { Text("OK") } })
    when (section) {
        "orders" -> OrdersScreen(padding, api) { section = "account" }
        "seller" -> SellerDashboardScreen(padding, api) { section = "account" }
        else -> LazyColumn(Modifier.fillMaxSize().padding(padding), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            item { Text("My Account", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.ExtraBold); Text(if (guestMode) "Guest browsing" else userName.ifBlank { "AARVO Customer" }, style = MaterialTheme.typography.titleMedium) }
            if (guestMode) {
                item { Card(Modifier.fillMaxWidth()) { Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) { Text("Browse freely", fontWeight = FontWeight.Bold); Text("Products and cart are available without verification. Login is required only when you purchase."); Button(onClick = onLogin, modifier = Modifier.fillMaxWidth()) { Text("Login / Sign Up with OTP") } } } }
            } else {
                item { Text("Orders & Shopping", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold) }
                item { Button(onClick = { section = "orders" }, modifier = Modifier.fillMaxWidth()) { Text("My Orders & Tracking") } }
                item { Button(onClick = { info = "Your saved wishlist is available from the Wishlist tab in the bottom navigation." }, modifier = Modifier.fillMaxWidth()) { Text("Wishlist") } }
                item { Button(onClick = { activity.startActivity(Intent(activity, AddressBookActivity::class.java)) }, modifier = Modifier.fillMaxWidth()) { Text("Manage Delivery Addresses") } }
                item { Text("Account & Payments", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold) }
                item { Button(onClick = { info = "Payment methods are handled securely during checkout. AARVO never stores raw card credentials." }, modifier = Modifier.fillMaxWidth()) { Text("Saved Payment Methods") } }
                item { Button(onClick = { info = "Coupons and offers will appear here when active for your account." }, modifier = Modifier.fillMaxWidth()) { Text("Coupons & Offers") } }
                item { Button(onClick = { info = "Notification preferences are ready for the production notification service." }, modifier = Modifier.fillMaxWidth()) { Text("Notifications & Preferences") } }
                item { Text("Profile & Security", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold) }
                item { Button(onClick = { info = "Profile editing is linked to your AARVO account. Your mobile number remains the primary OTP identity." }, modifier = Modifier.fillMaxWidth()) { Text("Profile & Edit Profile") } }
                item { Button(onClick = { info = "Login security uses mobile OTP and server-side authentication. Never share an OTP with anyone." }, modifier = Modifier.fillMaxWidth()) { Text("Security & Login") } }
                item { Button(onClick = { info = "App settings are stored locally on this device. More preferences can be added without changing your account." }, modifier = Modifier.fillMaxWidth()) { Text("App Settings") } }
                item { Button(onClick = { info = "AARVO currently uses English UI text. Additional Indian languages can be enabled in a future language pack." }, modifier = Modifier.fillMaxWidth()) { Text("Language") } }
                item { Text("Help & Legal", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold) }
                item { Button(onClick = { info = "For support, keep your order ID ready. AARVO support can help with delivery, returns, refunds and account issues." }, modifier = Modifier.fillMaxWidth()) { Text("Help Centre / Customer Support") } }
                item { Button(onClick = { info = "Contact AARVO support with your registered mobile number and order ID when applicable." }, modifier = Modifier.fillMaxWidth()) { Text("Contact Us") } }
                item { Button(onClick = { info = "Terms of Service, Privacy Policy and Refund Policy will be shown here from the production legal pages." }, modifier = Modifier.fillMaxWidth()) { Text("Terms • Privacy • Refund Policy") } }
                item { Button(onClick = { info = "Thank you for using AARVO. Rating and review submission can be enabled after the store listing is published." }, modifier = Modifier.fillMaxWidth()) { Text("Rate AARVO") } }
                item { Text("Seller", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold) }
                item { Button(onClick = { activity.startActivity(Intent(activity, SellerAccountActivity::class.java)) }, modifier = Modifier.fillMaxWidth()) { Text("Become a Seller") } }
                if (role == "SELLER") item { Button(onClick = { section = "seller" }, modifier = Modifier.fillMaxWidth()) { Text("Seller Dashboard") } }
                item { Text("Buyer payments are server-verified before an order becomes confirmed.", style = MaterialTheme.typography.bodySmall) }
                item { TextButton(onClick = onSignOut, modifier = Modifier.fillMaxWidth()) { Text("Log out") } }
                item { TextButton(onClick = { info = "Account deletion is a permanent action. Contact AARVO support to request deletion and data removal." }, modifier = Modifier.fillMaxWidth()) { Text("Delete Account") } }
            }
        }
    }
}

'''
          text = text[:start] + new_block + text[end:]
          path.write_text(text)
          print('Customer account center upgraded')
          PY

      - name: Commit only if changed
        run: |
          git config user.name "AARVO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarvo/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No account source changes required"
          else
            git commit -m "feat(account): complete premium customer account center"
            git push
          fi
