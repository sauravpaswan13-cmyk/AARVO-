name: Upgrade AARVO Account System

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/aarvo/MainActivity.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Account screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          text = path.read_text()
          start = text.find('@Composable private fun AccountScreen(')
          end = text.find('@Composable private fun OrdersScreen(', start)
          if start < 0 or end < 0:
              raise SystemExit('AccountScreen boundaries not found')
          block = text[start:end]
          wishlist = 'AccountOption("❤️", "Wishlist", "Your saved products")'
          if wishlist not in block:
              print('Wishlist entry not present; leaving source unchanged')
          else:
              print('Account screen verified; wishlist entry exists')
          PY

      - name: Commit only if needed
        run: |
          git config user.name "AARVO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarvo/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No account-source changes required"
          else
            git commit -m "fix(account): make wishlist entry actionable"
            git push
          fi
