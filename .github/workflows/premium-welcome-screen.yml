name: Premium AARVO Welcome Screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify premium welcome UI is present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/aarvo/MainActivity.kt')
          text = path.read_text()
          required = [
              'Welcome to AARVO',
              'Premium shopping, made simple.',
              'Continue to AARVO',
              'Login / Sign Up with OTP is available inside the app',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing premium welcome UI text: ' + ', '.join(missing))
          print('Premium welcome UI verification passed')
          PY
