name: AARVO Home Guest UI APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarvo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the official Gradle 9.7.1 distribution directly for this CI build.
      # The repository's legacy wrapper JAR is not trusted/validated in this job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Validate MSG91 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MSG91_WIDGET_TOKEN" || { echo "MSG91_WIDGET_TOKEN is missing"; exit 1; }
          echo "MSG91 widget token is available (length: ${#MSG91_WIDGET_TOKEN})"

      # Source is now authoritative in the repository; do not mutate Kotlin/JS during CI.
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PaarvoApiBaseUrl=https://aarvo-api.onrender.com -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-home-guest-ui-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
