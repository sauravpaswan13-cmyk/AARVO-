name: AARVO Home Guest UI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the official Gradle 9.7.1 distribution directly for this CI build.
      # The repository's legacy wrapper JAR is not trusted/validated in this job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Apply AARVO UI changes
        run: |
          python3 scripts/integrate_ai.py
          python3 scripts/aarvo_home_guest_ui.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PaarvoApiBaseUrl=https://aarvo-api.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-home-guest-ui-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
