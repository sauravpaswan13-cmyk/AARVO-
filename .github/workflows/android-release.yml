name: AARVO Android Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Prepare MSG91 token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${MSG91_WIDGET_TOKEN//$'\r'/}"
          TOKEN="${TOKEN//$'\n'/}"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$TOKEN" || { echo 'MSG91_WIDGET_TOKEN is empty or unavailable to this workflow.'; exit 1; }
          echo "MSG91 widget token is available (length: ${#TOKEN})"
          printf 'MSG91_WIDGET_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        id: signing_config
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Signing configuration unavailable: AARVO_KEYSTORE_BASE64 is empty.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Signing configuration unavailable: AARVO_KEYSTORE_PASSWORD is empty.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Signing configuration unavailable: AARVO_KEY_ALIAS is empty.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Signing configuration unavailable: AARVO_KEY_PASSWORD is empty.'; exit 1; }

      - name: Restore release keystore
        id: restore_keystore
        if: steps.signing_config.outcome == 'success'
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --ignore-garbage --decode > "$RUNNER_TEMP/aarvo-release.jks"
          test -s "$RUNNER_TEMP/aarvo-release.jks"

      - name: Verify release keystore
        id: verify_keystore
        if: steps.restore_keystore.outcome == 'success'
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$RUNNER_TEMP/aarvo-release.jks" -storepass "$STORE_PASSWORD" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/aarvo-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/aarvo-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          echo 'Release keystore and signing alias verified.'

      - name: Build signed release APK and AAB
        id: signed_build
        if: steps.verify_keystore.outcome == 'success'
        env:
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease \
            -PaarvoReleaseStoreFile="$RUNNER_TEMP/aarvo-release.jks" \
            -PaarvoReleaseStorePassword="$STORE_PASSWORD" \
            -PaarvoReleaseKeyAlias="$KEY_ALIAS" \
            -PaarvoReleaseKeyPassword="$KEY_PASSWORD" \
            -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN" \
            --stacktrace

      - name: Verify signed outputs
        if: steps.signed_build.outcome == 'success'
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo 'Signed APK verified.'

      - name: Build installable debug APK fallback
        if: steps.signed_build.outcome != 'success'
        run: |
          set -euo pipefail
          echo 'Release signing is unavailable or invalid; building an installable debug APK so the app remains testable.'
          gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}" -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"
        env:
          AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

      - name: Upload signed APK
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload installable debug APK fallback
        if: steps.signed_build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-debug-apk-fallback
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aarvo-release.jks"
