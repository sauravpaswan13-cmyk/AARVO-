name: AARVO Android Release AAB

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aarvo-release.jks"
          chmod 600 "$RUNNER_TEMP/aarvo-release.jks"
          test -s "$RUNNER_TEMP/aarvo-release.jks"

      - name: Build signed release AAB
        env:
          AARVO_STORE_FILE: ${{ runner.temp }}/aarvo-release.jks
          AARVO_STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          AARVO_KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          AARVO_KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            -PaarvoReleaseStoreFile="$AARVO_STORE_FILE" \
            -PaarvoReleaseStorePassword="$AARVO_STORE_PASSWORD" \
            -PaarvoReleaseKeyAlias="$AARVO_KEY_ALIAS" \
            -PaarvoReleaseKeyPassword="$AARVO_KEY_PASSWORD" \
            --stacktrace

      - name: Verify AAB output
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v5
        with:
          name: aarvo-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
