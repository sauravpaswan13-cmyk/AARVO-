name: AARVO Android Release

# Release gate verification trigger: signed APK/AAB + signature validation.

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Prepare MSG91 token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${MSG91_WIDGET_TOKEN//$'\r'/}"
          TOKEN="${TOKEN//$'\n'/}"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$TOKEN" || { echo 'MSG91_WIDGET_TOKEN is empty or unavailable to this workflow.'; exit 1; }
          echo "MSG91 widget token is available (length: ${#TOKEN})"
          printf 'MSG91_WIDGET_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'AARVO_KEYSTORE_BASE64 is empty.'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'AARVO_KEYSTORE_PASSWORD is empty.'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'AARVO_KEY_ALIAS is empty.'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'AARVO_KEY_PASSWORD is empty.'; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --ignore-garbage --decode > "$RUNNER_TEMP/aarvo-release.jks"
          test -s "$RUNNER_TEMP/aarvo-release.jks"

      - name: Verify release keystore and alias
        env:
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Checking release keystore with configured alias..."
          set +e
          KEYTOOL_OUTPUT="$(keytool -list -keystore "$RUNNER_TEMP/aarvo-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Keystore validation failed. Exact keytool error:"
            printf '%s\n' "$KEYTOOL_OUTPUT"
            echo "The keystore file itself was restored successfully; this points to the store password or configured alias."
            exit "$STATUS"
          fi
          echo 'Release keystore and signing alias verified.'

      - name: Build signed release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease \
            -PaarvoReleaseStoreFile="$RUNNER_TEMP/aarvo-release.jks" \
            -PaarvoReleaseStorePassword="$STORE_PASSWORD" \
            -PaarvoReleaseKeyAlias="$KEY_ALIAS" \
            -PaarvoReleaseKeyPassword="$KEY_PASSWORD" \
            -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN" \
            -PaarvoApiBaseUrl="https://aarvo-api.onrender.com" \
            --stacktrace

      - name: Verify signed outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo 'Signed APK verified.'

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: aarvo-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/aarvo-release.jks"
