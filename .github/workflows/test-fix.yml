name: AARVO Test Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch readiness test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/release-readiness.test.js')
          s = p.read_text()
          old = "  assert.ok(api.includes('https://'), 'API client must contain the HTTPS transport guard');"
          new = '''  assert.match(api, /URI\\(baseUrl\\)/);\n  assert.match(api, /uri\\.scheme\\.equals\\(\\\"https\\\", ignoreCase = true\\\)/);'''
          if old not in s:
              raise SystemExit('expected readiness assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'URI\\(baseUrl\\)' backend/tests/release-readiness.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/release-readiness.test.js .github/workflows/test-fix.yml
          git commit -m 'test: align HTTPS readiness assertion with URI guard'
          git rm .github/workflows/test-fix.yml
          git commit -m 'chore: remove temporary test fixer'
          git push