name: Build AARVO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: aarvo-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify Android project
        run: test -f settings.gradle.kts && test -f app/build.gradle.kts

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}"
        env:
          AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}"
        env:
          AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
