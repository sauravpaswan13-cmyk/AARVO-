name: Build AARVO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: aarvo-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false

      - name: Verify Android project
        run: test -f settings.gradle.kts && test -f app/build.gradle.kts

      - name: Prepare MSG91 token
        shell: bash
        run: |
          TOKEN="${MSG91_WIDGET_TOKEN//$'\r'/}"
          TOKEN="${TOKEN//$'\n'/}"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "MSG91_WIDGET_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi
          echo "MSG91_WIDGET_TOKEN is available (length: ${#TOKEN})"
          printf 'MSG91_WIDGET_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Verify production API configuration
        run: echo "AARVO production API defaults to https://aarvo-api.onrender.com"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}" -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"
        env:
          AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="${AARVO_API_BASE_URL:-https://aarvo-api.onrender.com}" -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"
        env:
          AARVO_API_BASE_URL: ${{ vars.AARVO_API_BASE_URL }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
