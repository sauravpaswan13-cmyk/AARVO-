name: Build AARVO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: aarvo-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MSG91_WIDGET_TOKEN: ${{ secrets.MSG91_WIDGET_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle 9.7.1 without project wrapper
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-9.7.1/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Verify Android project
        run: test -f settings.gradle.kts && test -f app/build.gradle.kts

      - name: Prepare MSG91 token
        shell: bash
        run: |
          TOKEN="${MSG91_WIDGET_TOKEN//$'\r'/}"
          TOKEN="${TOKEN//$'\n'/}"
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "MSG91_WIDGET_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi
          echo "MSG91_WIDGET_TOKEN is available (length: ${#TOKEN})"
          printf 'MSG91_WIDGET_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Verify production API configuration
        run: echo "AARVO production API pinned to https://aarvo-api.onrender.com"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="https://aarvo-api.onrender.com" -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"

      - name: Prepare release signing
        shell: bash
        env:
          AARVO_KEYSTORE_BASE64: ${{ secrets.AARVO_KEYSTORE_BASE64 }}
          AARVO_KEYSTORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          AARVO_KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          AARVO_KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AARVO_KEYSTORE_BASE64" || { echo "Missing AARVO_KEYSTORE_BASE64"; exit 1; }
          test -n "$AARVO_KEYSTORE_PASSWORD" || { echo "Missing AARVO_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$AARVO_KEY_ALIAS" || { echo "Missing AARVO_KEY_ALIAS"; exit 1; }
          test -n "$AARVO_KEY_PASSWORD" || { echo "Missing AARVO_KEY_PASSWORD"; exit 1; }
          printf '%s' "$AARVO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aarvo-release-key.jks"
          test -s "$RUNNER_TEMP/aarvo-release-key.jks"
      - name: Build release AAB (signed)
        shell: bash
        env:
          AARVO_KEYSTORE_PASSWORD: ${{ secrets.AARVO_KEYSTORE_PASSWORD }}
          AARVO_KEY_ALIAS: ${{ secrets.AARVO_KEY_ALIAS }}
          AARVO_KEY_PASSWORD: ${{ secrets.AARVO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease --stacktrace --project-prop aarvoReleaseStoreFile="$RUNNER_TEMP/aarvo-release-key.jks" --project-prop aarvoReleaseStorePassword="$AARVO_KEYSTORE_PASSWORD" --project-prop aarvoReleaseKeyAlias="$AARVO_KEY_ALIAS" --project-prop aarvoReleaseKeyPassword="$AARVO_KEY_PASSWORD" -Pandroidx.compose.material3.ExperimentalMaterial3Api=true -PaarvoApiBaseUrl="https://aarvo-api.onrender.com" -Pmsg91WidgetToken="$MSG91_WIDGET_TOKEN"
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab > "$RUNNER_TEMP/aab-signature-check.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature-check.txt"
      - name: Clean release signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/aarvo-release-key.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-mobile-entry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AARVO-mobile-entry-release-aab-signed
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Keep the Android SDK setup limited to packages that still exist on current runners.
